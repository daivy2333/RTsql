schema: spec-driven

context: |
  Tech stack: Rust (latest stable), Tokio async runtime, sqlparser-rs, criterion.rs
  Project: RTsql — 异步协程驱动的高性能嵌入式关系型数据库
  Language: Rust 2021 edition
  Testing: cargo test + criterion benchmarks (12 suites: micro_bench/concurrent_bench/cache_bench/scale_bench/index_key_encoding_bench/sqlite_compare/data_scan_bench/wal_group_commit_bench/tx_id_bench/visibility_bench/buffer_pool_concurrency_bench/pipeline_stages_bench)
  Formatting: rustfmt + clippy
  所有产出物必须用简体中文撰写。
  技术术语如 API、WAL、MVCC、B-Tree 保持英文原样。

rules:
  proposal:
    - 包含回滚方案
    - 说明为什么做、做什么、不做什么
    - 标注影响范围
    - 引用相关 M/R/I 编号
  specs:
    - 使用 Requirement + Scenario 结构描述行为，Scenario 以 WHEN/THEN 陈述，前置条件可用 GIVEN
    - 跨模块约束写 project-model（Mxx）
    - 长期选择及其理由写 change 的 design.md，随 change 归档
    - 已验证结论写 analysis，可重复操作流程写 Runbook，缺陷写 Issue
    - 索引元数据写 references（Rxx）
    - 未承诺改进写 improvements（Ixx）
  design:
    - 复杂流程需包含序列图
    - 标注关键依赖关系
    - 包含备选方案对比
  tasks:
    - 每个任务可独立验证
    - 标注依赖关系
    - 包含验收标准
    - 关联里程碑编号（MSxx）
