schema: spec-driven

context: |
  Tech stack: Rust (latest stable), Tokio async runtime, sqlparser-rs, criterion.rs
  Project: RTsql — 异步协程驱动的高性能嵌入式关系型数据库
  Language: Rust 2021 edition
  Testing: cargo test + criterion benchmarks (micro/concurrent/scale/sqlite_compare)
  Formatting: rustfmt + clippy
  所有产出物必须用简体中文撰写。
  技术术语如 API、WAL、MVCC、B-Tree 保持英文原样。

rules:
  proposal:
    - 包含回滚方案
    - 说明为什么做、做什么、不做什么
    - 标注影响范围
    - 引用相关 ADR 编号
  specs:
    - 使用 Given/When/Then 格式描述行为
    - 每个 spec.md 包含版本号和最后更新日期
    - 变更时使用 Delta Specs（ADDED/MODIFIED/REMOVED）
  design:
    - 复杂流程需包含序列图
    - 标注关键依赖关系
    - 包含备选方案对比
  tasks:
    - 每个任务可独立验证
    - 标注依赖关系
    - 包含验收标准
    - 关联里程碑编号（M19-M48）
