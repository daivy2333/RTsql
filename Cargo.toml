[package]
name = "rtsql"
version = "0.1.0"
edition = "2021"
description = "Async coroutine-driven embedded relational database"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util"] }
async-trait = "0.1"
thiserror = "1.0"
anyhow = "1.0"
futures = "0.3"
sqlparser = "0.44"
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
lru = "0.12"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
rusqlite = "0.31"
tempfile = "3.0"

[[bench]]
name = "micro_bench"
harness = false

[[bench]]
name = "concurrent_bench"
harness = false

[[bench]]
name = "cache_bench"
harness = false

[[bench]]
name = "scale_bench"
harness = false

[[bench]]
name = "sqlite_compare"
harness = false

[profile.release]
opt-level = 3
lto = true

[profile.dev]
opt-level = 0